  description: '<p>Macro-organisme exogène de vingt à trente mètres de haut, sur sept pattes, couvert de poches de Fiel sous pression. MOX : il faut 2 points de Blessures pour cocher une case de sa jauge de Blessures. Il crée un Flux de niveau 2 autour de lui (p. 205). Ses filaments préhensiles infligent un malus de −2 à toute action d''une créature plus petite à moins de 10 m. Attiré et apaisé par les rythmes graves et réguliers, repoussé par les sons stridents. (Livre de base p. 282)</p>'
