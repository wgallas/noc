  description: '<p>Au sommet de l''échelle exogène : parfois érigée en divinité à la tête d''un culte, imprévisible et ambitieuse. Hors du Dédale, ne survit que quelques minutes près d''un Seuil.</p><p>Flétrissement : −1 Énergie noire par seconde. La proximité d''un Seuil ajoute son Flux à la classe pour ce délai ; tombé sous 0 en Énergie noire, l''Autre succombe.</p><p>Profil de base (Livre de base p. 278-280) : tous les Domaines à 2 et tous les Talents à 0, plus l''Énergie noire (8 − classe exogène), ajoutée par le système à tout sauf la Lumière. Pour typer la créature, augmenter un trait en en diminuant un autre d''autant.</p><p>Surcharge de Noirceur : dépenser 1 (et 1 seul) point d''Énergie noire pour +2 à un Talent pendant un round (ou 10 minutes hors action).</p><p>Lumière : dans l''aura d''un personnage ayant Lumière 1 ou plus, l''Énergie noire compte pour autant de moins dans le calcul des Domaines et Talents.</p><p>Ténèbres : sa réaction face à un personnage dépend du niveau de
    Ténèbres de celui-ci (p. 280).</p>'
